name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RandomMOTD-${{ github.sha }}
          path: target/RandomMOTD-*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release jar
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -n 1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" target/RandomMOTD-*.jar \
            --title "RandomMOTD Reborn $tag" \
            --generate-notes

  compatibility:
    name: Paper ${{ matrix.minecraft }} runtime
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21'
            java: '21'
          - minecraft: '26.3'
            java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up server Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download built plugin
        uses: actions/download-artifact@v4
        with:
          pattern: RandomMOTD-*
          merge-multiple: true
          path: plugin-build
      - name: Start Paper and check plugin
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          cp plugin-build/RandomMOTD-*.jar smoke/plugins/
          printf 'eula=true\\n' > smoke/eula.txt
          AGENT='RandomMOTD-Reborn-compatibility-tests/1.0 (https://github.com/Prof1611/RandomMOTD-Reborn)'
          RESPONSE=$(curl --fail --silent --show-error --retry 3 -H "User-Agent: $AGENT" "https://fill.papermc.io/v3/projects/paper/versions/$MC_VERSION/builds")
          URL=$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty' <<< "$RESPONSE")
          if [ -z "$URL" ]; then
            echo "No stable Paper build for $MC_VERSION" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 -H "User-Agent: $AGENT" "$URL" -o smoke/paper.jar
          cd smoke
          timeout 150s java -Xms256M -Xmx1200M -jar paper.jar --nogui > server.log 2>&1 &
          PID=$!
          started=0
          for i in $(seq 1 150); do
            if grep -q 'Done (.*)! For help, type "help"' server.log; then
              started=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          tail -n 90 server.log
          if [ "$started" -ne 1 ]; then
            echo 'Paper did not finish starting' >&2
            exit 1
          fi
          if ! grep -Eiq '(Enabling RandomMOTD|Enabled RandomMOTD)' server.log; then
            echo 'RandomMOTD was not enabled' >&2
            exit 1
          fi
          if grep -Eiq '(Error occurred while enabling RandomMOTD|Could not load.*RandomMOTD|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError)' server.log; then
            echo 'Plugin compatibility error in startup logs' >&2
            exit 1
          fi
          echo "PASS: RandomMOTD loaded on Paper $MC_VERSION (Java $(java -version 2>&1 | head -n 1))"
