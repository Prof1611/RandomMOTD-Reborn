name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RandomMOTD-${{ github.sha }}
          path: target/RandomMOTD-*.jar
          if-no-files-found: error
